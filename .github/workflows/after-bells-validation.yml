name: Validate After the Bells drafts
on:
  push:
    paths:
      - 'stories/after-the-bells/**'
      - 'integration/after_bells_queue.py'
      - '.github/workflows/after-bells-validation.yml'
  pull_request:
    paths:
      - 'stories/after-the-bells/**'
      - 'integration/after_bells_queue.py'
      - '.github/workflows/after-bells-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate production register and manuscript pairs
        run: python integration/after_bells_queue.py validate
